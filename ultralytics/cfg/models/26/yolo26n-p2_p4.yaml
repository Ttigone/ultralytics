# Ultralytics YOLO26 object detection model with P2/4 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# 引入 p2, 移除 p5

# Parameters
nc: 10 # visdrone
end2end: True
reg_max: 1 # 无 DFL

scale: n

scales: 
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 329 layers, 2,662,400 parameters, 2,662,400 gradients, 9.5 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 329 layers, 9,765,856 parameters, 9,765,856 gradients, 27.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 349 layers, 21,144,288 parameters, 21,144,288 gradients, 91.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 489 layers, 25,815,520 parameters, 25,815,520 gradients, 115.3 GFLOPs
  x: [1.00, 1.50, 512] # summary: 489 layers, 57,935,232 parameters, 57,935,232 gradients, 256.9 GFLOPs

# BackBone P2 P3 P4
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # P2 feature
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # P3 feature
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]   # P4 feature

  # P4 -> P5 backbone
  # - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  # - [-1, 2, C3k2, [1024, True]]
  # - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  # - [-1, 2, C2PSA, [1024]] # 10

# Neck and PAN: P2, P3, P4
head:
  # Top-down: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 7
  - [[-1, 4], 1, Concat, [1]]                    # 8
  - [-1, 2, C3k2, [256, True]]                   # 9: fused P3

  # Top-down: P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 2], 1, Concat, [1]]                    # 11
  - [-1, 2, C3k2, [128, True]]                   # 12: fused P2

  # Bottom-up: P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                   # 13
  - [[-1, 9], 1, Concat, [1]]                    # 14
  - [-1, 2, C3k2, [256, True]]                   # 15: output P3

  # Bottom-up: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                   # 16
  - [[-1, 6], 1, Concat, [1]]                    # 17
  - [-1, 2, C3k2, [512, True]]                   # 18: output P4

  # Detect P2, P3, P4
  - [[12, 15, 18], 1, Detect, [nc]]