# YOLO26n-P2 (P2/4 ~ P5/32) + CBAM 双注意力（P2/P3）
# 对应 SDD-YOLO 的 P2 高分辨率头 + Dual Attention 方案。
# 输入 640 时输出尺度：P2 160x160、P3 80x80、P4 40x40、P5 20x20。
#
# end2end: False = 只训练一对多（O2M）分支，部署走 raw 八输出 + 板端 NMS。
#   小目标（P2 头）正样本更密，召回/mAP 通常优于一对一分支；
#   每个 head 张量独立量化，INT8 精度损失小，RKNN 上板首选。
#   需要 NMS-free 单输出时用 yolo26n-p2-cbam-e2e.yaml。

# Parameters
nc: 1 # number of classes
end2end: False # 双头训练关闭：仅一对多分支，NMS 在板端做
reg_max: 1 # DFL bins（reg_max=1 即 DFL-free，RKNN INT8 友好）

scale: n

scales: # model compound scaling constants
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  # ---- Dual Attention: 仅 P2 / P3，抑制云、鸟、建筑边缘等背景误检 ----
  - [-1, 1, CBAM, [7]] # 20 P2 attention
  - [-1, 1, Conv, [128, 3, 2]] # 21
  - [[-1, 16], 1, Concat, [1]] # 22 cat head P3
  - [-1, 2, C3k2, [256, True]] # 23 (P3/8-small)
  - [-1, 1, CBAM, [7]] # 24 P3 attention

  - [-1, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 13], 1, Concat, [1]] # 26 cat head P4
  - [-1, 2, C3k2, [512, True]] # 27 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 28
  - [[-1, 10], 1, Concat, [1]] # 29 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 30 (P5/32-large)

  - [[20, 24, 27, 30], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
