# Ultralytics YOLO26 object detection model with P2/4 - P5/32 outputs, a Dilation-wise Residual (DWR)
# block on the P2 backbone feature and a training-only super-resolution auxiliary branch (DetectSR).
# The SR branch exists only while training; use sr_loss>0 to enable it and it is absent from every export.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

scale: n

scales: # model compound scaling constants, i.e. 'model=yolo26n-p2-dwr.yaml' will call yolo26-p2-dwr.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, DWR, [256, 4, [1, 2, 3, 4]]] # 3 DWR on P2 feature (4 dilation rates, residual)
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]] # 13 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 3], 1, Concat, [1]] # 19 cat backbone P2 (DWR output)
  - [-1, 2, C3k2, [128, True]] # 20 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]] # 21
  - [[-1, 17], 1, Concat, [1]] # 22 cat head P3
  - [-1, 2, C3k2, [256, True]] # 23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 14], 1, Concat, [1]] # 25 cat head P4
  - [-1, 2, C3k2, [512, True]] # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 27
  - [[-1, 11], 1, Concat, [1]] # 28 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 29 (P5/32-large)

  - [[20, 23, 26, 29], 1, DetectSR, [nc]] # DetectSR(P2, P3, P4, P5), training-only SR branch
